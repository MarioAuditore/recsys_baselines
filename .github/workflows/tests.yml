name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - name: Verify installed wheel outside the checkout
        run: |
          python -m pip wheel --no-deps . -w dist
          python -m pip uninstall -y base-recsys
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from recsys.config import compose
          from recsys.data import PreparedDataset
          from recsys.training import run_training

          config = compose(["tuning.space.model.dropout.high=0.4"], config_name="beauty_sasrec")
          assert config["model"]["name"] == "sasrec"
          assert config["dataset"]["name"] == "amazon_beauty"
          assert config["tuning"]["space"]["model"]["dropout"]["high"] == 0.4
          assert compose()["dataset"]["name"] == "ml1m"
          PY
          python -m recsys.tune -cn beauty_sasrec tuning.space.model.dropout.high=0.4 --cfg job --resolve > /dev/null
