# @package _global_
defaults:
- base
- _self_
- execution
- override /dataset: amazon_clothing
- override /model: sasrec
training:
  batch_size: 2

tuning:
  space:
    model:
      embedding_dim: {
        type: categorical,
        choices: [32, 64, 128]
      }
      heads: {
        type: categorical,
        choices: [1, 2, 4]
      }
      blocks: {
        type: int,
        low: 1,
        high: 3
      }
      dropout: {
        type: float,
        low: 0.0,
        high: 0.5
      }
    training:
      batch_size: {
        type: categorical,
        choices: [1, 2]
      }
      learning_rate: {
        type: float,
        low: 0.0001,
        high: 0.01,
        log: true
      }
      weight_decay: {
        type: categorical,
        choices: [0.0, 0.000001, 0.0001]
      }
