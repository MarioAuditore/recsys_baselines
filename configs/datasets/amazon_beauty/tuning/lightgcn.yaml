# @package _global_
defaults:
- /datasets/amazon_beauty/lightgcn
- /optuna: tpe
- _self_
tuning:
  space:
    model:
      embedding_dim:
        type: categorical
        choices:
        - 32
        - 64
        - 128
      layers:
        type: int
        low: 1
        high: 4
      loss:
        regularization:
          type: float
          low: 1.0e-06
          high: 0.01
          log: true
      sampling:
        count:
          type: categorical
          choices:
          - 1
          - 2
          - 4
    training:
      learning_rate:
        type: float
        low: 0.0001
        high: 0.01
        log: true
