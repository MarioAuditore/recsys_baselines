# @package _global_
defaults:
- dataset
- _self_
- /execution
max_seq_length: 50
model:
  name: lightgcn
  embedding_dim: 64
  layers: 3
  init_std: 0.1
  loss:
    name: bpr
    regularization: 0.0001
  sampling:
    count: 1
    distribution: uniform
    alpha: 0.75
training:
  epochs: 100
  batch_size: 1024
  learning_rate: 0.001
  weight_decay: 0.0
