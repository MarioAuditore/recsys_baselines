# @package _global_
defaults:
- dataset
- _self_
- /execution
max_seq_length: 100
model:
  name: sasrec
  embedding_dim: 64
  heads: 2
  blocks: 2
  dropout: 0.2
  loss:
    name: sce
    n_buckets: 8
    bucket_size_x: 64
    bucket_size_y: 256
    mix_x: false
training:
  epochs: 100
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0
run_name: sasrec_sce_${dataset.name}_seed${seed}
