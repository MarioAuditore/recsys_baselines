sampler: grid
trials: 4
timeout: null
study_name: null
storage: sqlite:///outputs/optuna.db
pruning: false
warmup_epochs: 0
# The full-node interpolation replaces the experiment space instead of merging keys.
space: ${tuning.grid_space}
grid_space:
  training:
    learning_rate: {
      type: categorical,
      choices: [0.001, 0.003]
    }
  model:
    dropout: {
      type: categorical,
      choices: [0.1, 0.2]
    }
