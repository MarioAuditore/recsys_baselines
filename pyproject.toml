[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "base-recsys"
version = "0.1.0"
description = "Small, reproducible sequential recommendation experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.3,<3", "numpy>=1.26,<3", "scipy>=1.12,<2",
  "pandas>=2.2,<3", "hydra-core>=1.3.2,<1.4", "optuna>=4,<5",
  "matplotlib>=3.8,<4", "pyarrow>=16", "requests>=2.32", "duckdb>=1.1,<2",
  "tqdm>=4.66,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "recsys/configs"
"third_party" = "recsys/third_party"
"THIRD_PARTY.md" = "recsys/THIRD_PARTY.md"
